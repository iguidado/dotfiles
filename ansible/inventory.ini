# Le playbook cible le groupe `dotfiles`, jamais `all` : un hôte doit y être
# déclaré pour recevoir les dotfiles. Test/Vagrantfile reconstruit ce même
# groupe côté VM via `ansible.groups` -- l'inventaire que Vagrant génère ne
# range les invités dans AUCUN groupe nommé, et un play qui ne matche rien
# réussit en silence.
[dotfiles]
localhost ansible_connection=local

# Profils. Ranger un hôte dans un de ces groupes charge automatiquement
# ansible/group_vars/<groupe>.yml, qui surcharge la table `dotfiles_tools`
# héritée de group_vars/all.yml (`all` est toujours de plus basse précédence,
# la surcharge ne dépend donc pas de l'ordre alphabétique des groupes).
# Équivalent en ligne de commande : -e dotfiles_profile=minimal
[minimal]

# Groupe du playbook PRIVILÉGIÉ ansible/container_base.yml, laissé VIDE à
# dessein : ce play désinstalle la pile Docker de l'hôte avant de reposer
# docker-ce. On n'y range un hôte que délibérément, jamais par héritage d'un
# `hosts: all`. Les VMs de test y sont mises par Test/Vagrantfile, et seulement
# pour le provisioner `containers` (run: never).
[containers]
