- name: install dotfiles with Stow
  hosts: all

  vars:
    # Racine du dépôt déduite de l'emplacement de ce playbook : une exécution
    # locale ne peut donc plus stower un autre clone que le sien.
    # `playbook_dir` est un chemin du CONTRÔLEUR -- pour une cible distante,
    # surcharger : -e dotfiles_repo_dir=/home/vagrant/dotfiles
    dotfiles_repo_dir: "{{ playbook_dir | dirname }}"
    dotfiles_stow_dir: "{{ dotfiles_repo_dir }}/Srcs"

    # Changer le shell de connexion touche /etc/passwd. C'est la seule action
    # de ce playbook qui modifie le compte lui-même : elle reste débrayable.
    dotfiles_set_login_shell: true

    # stow refuse de toucher à un fichier régulier et n'a aucun mode
    # interactif : `--override` ne vaut que pour les liens qu'il gère déjà, et
    # `--adopt` ferait l'inverse de ce qu'on veut (importer le fichier de la
    # machine dans le dépôt). Les fichiers préexistants sont donc DÉPLACÉS ici,
    # jamais supprimés. Mettre à false pour retrouver l'arrêt sur conflit.
    dotfiles_backup_conflicts: true
    dotfiles_backup_dir: "{{ ansible_user_dir }}/.dotfiles-backup/{{ ansible_date_time.iso8601_basic_short }}"

  tasks:
    # Ce playbook configure un espace UTILISATEUR : une fois stow présent, plus
    # aucune tâche n'exige de privilège. L'élévation n'est donc tentée que dans
    # le seul cas qui l'impose -- stow absent -- et son échec n'est pas fatal
    # en lui-même : il est traduit en message actionnable. Un compte sans sudo
    # reste utilisable dès lors que stow est fourni par l'administrateur.
    - name: Vérifier si stow est déjà disponible
      ansible.builtin.shell: command -v stow
      register: stow_binary
      changed_when: false
      failed_when: false

    # `package` choisit apt/apk/dnf selon la cible : Alpine n'échoue plus faute
    # de branche dédiée.
    - name: install stow
      ansible.builtin.package:
        name: stow
        state: present
      become: true
      when: stow_binary.rc != 0
      register: stow_install
      ignore_errors: true

    - name: Arrêt explicite si stow reste indisponible
      ansible.builtin.fail:
        msg: >-
          stow est absent et n'a pas pu être installé : ce compte ne dispose
          pas du privilège nécessaire. Fais installer le paquet `stow` par un
          administrateur, ou compile-le dans ~/.local, puis relance
          `task install`.
      when:
        - stow_binary.rc != 0
        - stow_install is failed

    # ~/.stow-global-ignore carries the secret-exclusion rules, but stow reads
    # it at startup. It must therefore be in place BEFORE any other package is
    # stowed -- otherwise the very first run on a fresh machine links secrets
    # anyway. `creates` keeps this idempotent without a simulation pass.
    - name: Bootstrap the global ignore file before anything else
      ansible.builtin.shell: "stow --no-folding stow -t ~"
      args:
        chdir: "{{ dotfiles_stow_dir }}"
        creates: "{{ ansible_user_dir }}/.stow-global-ignore"

    - name: Simulate Stow Execution
      ansible.builtin.shell: "stow --no-folding --simulate --verbose=2 * -t ~"
      args:
        chdir: "{{ dotfiles_stow_dir }}"
      register: stow_simulation
      # Disable tracking of change, this command is never considered as impacting system
      changed_when: false
      # rc=1 signale un conflit. On veut l'inspecter et le résoudre, donc cette
      # simulation ne doit pas interrompre le play à elle seule.
      failed_when: false

    # Un SEUL fichier préexistant fait échouer le déploiement de TOUS les
    # packages : stow annule tout dès le premier conflit. Le cas est banal --
    # la box Ubuntu 2204 livre par exemple son propre ~/.vimrc.
    # Deux formats de message coexistent selon la version de stow :
    #   2.4.x  CONFLICT when stowing gdb: cannot stow <src> over existing
    #          target .gdbinit since neither a link nor a directory [...]
    #   2.3.x  CONFLICT when stowing vim: existing target is neither a link
    #          nor a directory: .vimrc
    # Une seule règle ne couvre pas les deux, d'où les deux passes. Toute ligne
    # qu'aucune ne sait réduire à un chemin est écartée : elle ne sera pas
    # sauvegardée, et la replanification s'arrêtera dessus plutôt que de
    # déplacer n'importe quoi.
    - name: Recenser les fichiers en conflit
      ansible.builtin.set_fact:
        stow_conflicts: >-
          {{ stow_simulation.stderr_lines
             | select('search', '^CONFLICT when stowing')
             | map('regex_replace', '^.*over existing target (\S+) since .*$', '\1')
             | map('regex_replace', '^CONFLICT when stowing [^:]+: .*: (\S+)$', '\1')
             | reject('search', ' ')
             | list | unique }}

    - name: Créer l'arborescence de sauvegarde
      ansible.builtin.file:
        path: "{{ dotfiles_backup_dir }}/{{ item | dirname }}"
        state: directory
        mode: "0700"
      loop: "{{ stow_conflicts }}"
      when: dotfiles_backup_conflicts | bool

    # `mv`, pas `rm` : le contenu reste récupérable. `removes` rend la tâche
    # idempotente si le fichier a déjà été écarté.
    - name: Écarter les fichiers en conflit vers la sauvegarde
      ansible.builtin.command:
        cmd: "mv -- {{ ansible_user_dir }}/{{ item }} {{ dotfiles_backup_dir }}/{{ item }}"
        removes: "{{ ansible_user_dir }}/{{ item }}"
      loop: "{{ stow_conflicts }}"
      when: dotfiles_backup_conflicts | bool

    - name: Signaler les fichiers écartés
      ansible.builtin.debug:
        msg: >-
          Fichiers préexistants déplacés vers {{ dotfiles_backup_dir }} :
          {{ stow_conflicts | join(', ') }}
      when:
        - stow_conflicts | length > 0
        - dotfiles_backup_conflicts | bool

    # Le plan de référence est celui d'APRÈS la sauvegarde : c'est lui qui
    # décide de l'application, et lui qui doit être propre.
    - name: Replanifier après sauvegarde
      ansible.builtin.shell: "stow --no-folding --simulate --verbose=2 * -t ~"
      args:
        chdir: "{{ dotfiles_stow_dir }}"
      register: stow_plan
      changed_when: false
      failed_when: false

    - name: Arrêt si des conflits subsistent
      ansible.builtin.fail:
        msg: >-
          stow signale des conflits qui n'ont pas pu être résolus
          {{ 'automatiquement' if dotfiles_backup_conflicts | bool
             else '(sauvegarde désactivée via dotfiles_backup_conflicts)' }} :
          {{ stow_plan.stderr }}
      when: stow_plan.rc != 0

    - name: Appliquer Stow (uniquement si des changements ont été détectés)
      ansible.builtin.shell: "stow --no-folding * -t ~"
      args:
        chdir: "{{ dotfiles_stow_dir }}"
      # This task is only executed when simulation return contain the word 'LINK'
      when: "'LINK' in stow_plan.stderr or 'LINK' in stow_plan.stdout"
      register: result

    - name: check result
      ansible.builtin.debug:
        var: result

    # --- Environnement shell -------------------------------------------------
    # Srcs/zsh/.zshrc fait `source $ZSH/oh-my-zsh.sh` : sans oh-my-zsh, chaque
    # ouverture de shell échoue sur une machine fraîche. Déployer le dotfile ne
    # suffit donc pas, il faut fournir ce dont il dépend.
    #
    # Même règle que pour stow : le privilège n'est sollicité que là où il est
    # indispensable (le paquet zsh, le shell de connexion). Le clone
    # d'oh-my-zsh, lui, est du userland pur.

    - name: Vérifier si zsh est déjà disponible
      ansible.builtin.shell: command -v zsh
      register: zsh_binary
      changed_when: false
      failed_when: false

    - name: install zsh
      ansible.builtin.package:
        name: zsh
        state: present
      become: true
      when: zsh_binary.rc != 0
      register: zsh_install
      ignore_errors: true

    # Le chemin doit être relu : s'il vient d'être installé, la détection
    # initiale n'a rien capturé.
    - name: Localiser zsh
      ansible.builtin.shell: command -v zsh
      register: zsh_path
      changed_when: false
      failed_when: false

    - name: Avertir si zsh reste indisponible
      ansible.builtin.debug:
        msg: >-
          zsh est absent et n'a pas pu être installé : ce compte ne dispose pas
          du privilège nécessaire. Les dotfiles sont déployés, mais le shell de
          connexion restera inchangé tant qu'un administrateur n'aura pas
          installé le paquet `zsh`.
      when: zsh_path.rc != 0

    # oh-my-zsh vit dans le HOME : aucun privilège. `update: false` garde la
    # tâche idempotente et ne réécrit pas un clone existant à chaque exécution.
    - name: Installer oh-my-zsh
      ansible.builtin.git:
        repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: "{{ ansible_user_dir }}/.oh-my-zsh"
        depth: 1
        version: master
        update: false

    # Change /etc/passwd : exige un privilège. Sans lui on n'échoue pas, on
    # indique la commande à passer. Désactivable via dotfiles_set_login_shell.
    - name: Définir zsh comme shell de connexion
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        shell: "{{ zsh_path.stdout }}"
      become: true
      when:
        - dotfiles_set_login_shell | bool
        - zsh_path.rc == 0
        - ansible_user_shell != zsh_path.stdout
      ignore_errors: true

    # Le module `user` peut rapporter `ok` sans rien avoir fait : sur Alpine,
    # usermod appartient au paquet `shadow`, absent par défaut, et le
    # changement est alors silencieusement perdu. On relit donc /etc/passwd
    # plutôt que de croire le rapport de la tâche.
    - name: Relire le shell de connexion effectif
      ansible.builtin.shell: "getent passwd {{ ansible_user_id }} | cut -d: -f7"
      register: login_shell_effective
      changed_when: false
      failed_when: false
      when:
        - dotfiles_set_login_shell | bool
        - zsh_path.rc == 0

    - name: Avertir si le shell de connexion n'a pas été appliqué
      ansible.builtin.debug:
        msg: >-
          Le shell de connexion est resté « {{ login_shell_effective.stdout }} »
          au lieu de « {{ zsh_path.stdout }} » : privilège indisponible, ou
          usermod absent (sur Alpine, installer le paquet `shadow`).
          À faire toi-même : chsh -s {{ zsh_path.stdout }}
      when:
        - login_shell_effective.stdout is defined
        - login_shell_effective.stdout != zsh_path.stdout
