# Runtime de conteneurs.
#
# Ce play est le pendant PRIVILÉGIÉ du playbook dotfiles : poser un runtime de
# conteneurs demande des droits, quel que soit le moyen. Il ne doit donc jamais
# hériter d'une cible par défaut -- `hosts: all` combiné à l'inventaire
# d'ansible.cfg suffisait à faire de `ansible-playbook ansible/container_base.yml`
# une réécriture de la pile Docker de la machine de développement. On cible un
# groupe qui n'existe que si on l'a délibérément peuplé : voir [containers]
# dans ansible/inventory.ini.
#
# SÉLECTION D'ALTERNATIVE -- même principe que `dotfiles_tools` : la capacité
# visée est « faire tourner des conteneurs », et deux moyens y répondent.
#
#   container_runtime: podman   (défaut) rootless. L'installation demande du
#                               privilège, mais l'USAGE n'en demande plus :
#                               pas de démon, pas de groupe équivalent à root.
#                               C'est le seul des deux qui tienne la promesse
#                               du titre historique de ce fichier
#                               (« containerization at user_level »).
#
#   container_runtime: docker   Docker CE. Privilégié de bout en bout, et
#                               appartenir au groupe `docker` équivaut à un
#                               accès root sur la machine -- c'est documenté
#                               comme tel en amont, pas une opinion. À ne
#                               choisir que si un outillage l'impose.
#
# Se surcharge comme tout le reste : -e container_runtime=docker, ou dans un
# group_vars de profil.
- name: Poser un runtime de conteneurs
  hosts: containers

  # Pas de `become` au niveau du play : les faits seraient alors collectés en
  # root et `ansible_user_id` vaudrait « root », alors que tout l'intérêt est
  # de configurer le compte de l'UTILISATEUR. Chaque tâche demande l'élévation
  # si elle en a besoin, et seulement là.
  vars:
    container_runtime: podman

    # Plage d'UID/GID délégués au compte pour le rootless. 65536 est la taille
    # conventionnelle (un /16), suffisante pour tout usage normal.
    container_subid_count: 65536

  tasks:
    - name: Vérifier que le runtime demandé est connu
      ansible.builtin.assert:
        that: container_runtime in ['podman', 'docker']
        fail_msg: >-
          container_runtime « {{ container_runtime }} » inconnu.
          Valeurs acceptées : podman (défaut, rootless) ou docker.
        quiet: true

    # ------------------------------------------------------------------ podman
    # Rootless : l'installation est privilégiée, l'usage ne l'est plus.
    - name: Installer podman
      ansible.builtin.package:
        name: "{{ podman_packages[ansible_os_family] | default(['podman']) }}"
        state: present
      become: true
      vars:
        podman_packages:
          # uidmap fournit newuidmap/newgidmap, sans lesquels le rootless
          # échoue à créer son espace de noms utilisateur.
          Debian: [podman, uidmap]
          Alpine: [podman, shadow-uidmap]
      when: container_runtime == 'podman'

    # Le rootless repose sur des UID/GID subordonnés délégués au compte. Sans
    # entrée dans /etc/subuid et /etc/subgid, podman démarre puis échoue à la
    # première image. Les distributions ne les créent pas toujours.
    - name: Lire les plages d'UID subordonnés du compte
      ansible.builtin.command:
        cmd: "grep -c '^{{ ansible_user_id }}:' /etc/subuid /etc/subgid"
      register: container_subid
      changed_when: false
      failed_when: false
      check_mode: false
      when: container_runtime == 'podman'

    # usermod --add-subuids appartient au paquet `shadow` : présent d'office
    # sur Debian, absent d'Alpine par défaut (busybox). L'échec n'est pas
    # fatal, il est traduit plus bas en message actionnable.
    - name: Déléguer des UID/GID subordonnés au compte
      ansible.builtin.command:
        cmd: >-
          usermod
          --add-subuids 100000-{{ 100000 + container_subid_count - 1 }}
          --add-subgids 100000-{{ 100000 + container_subid_count - 1 }}
          {{ ansible_user_id }}
      become: true
      when:
        - container_runtime == 'podman'
        - container_subid.stdout is defined
        - "'0' in container_subid.stdout_lines | default([])"
      register: container_subid_added
      failed_when: false

    # ------------------------------------------------------------------ docker
    # Chemin privilégié, conservé pour les cas où un outillage impose Docker.
    - name: Retirer les paquets qui entrent en conflit avec Docker CE
      ansible.builtin.apt:
        pkg:
          - docker.io
          - docker-compose
          - docker-doc
          - podman-docker
          - containerd
          - runc
        state: absent
      become: true
      # `podman-docker` figure dans cette liste : c'est le shim qui fournit la
      # commande `docker` par-dessus podman. Le retirer n'a de sens que si on
      # installe réellement Docker CE -- d'où la garde sur le runtime, sans
      # laquelle choisir podman désinstallerait une partie de podman.
      when:
        - container_runtime == 'docker'
        - ansible_os_family == "Debian"

    - name: Installer les dépendances du dépôt Docker
      ansible.builtin.apt:
        name: [apt-transport-https, ca-certificates, curl, gnupg, lsb-release]
        state: present
        update_cache: true
      become: true
      when:
        - container_runtime == 'docker'
        - ansible_os_family == "Debian"

    # Le module `apt_key` et le binaire `apt-key` sont supprimés des
    # distributions récentes (Debian 13, Ubuntu 24.04). La clé va donc dans un
    # keyring dédié, référencé par `signed-by` dans la définition du dépôt.
    - name: Créer le répertoire des keyrings APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      become: true
      when:
        - container_runtime == 'docker'
        - ansible_os_family == "Debian"

    - name: Ajouter la clé GPG officielle Docker
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      become: true
      when:
        - container_runtime == 'docker'
        - ansible_os_family == "Debian"

    # L'architecture au sens Debian (amd64/arm64) ne se déduit pas de
    # `ansible_architecture`, qui renvoie x86_64. On la demande à dpkg.
    - name: Déterminer l'architecture Debian
      ansible.builtin.command: dpkg --print-architecture
      register: deb_architecture
      changed_when: false
      check_mode: false
      when:
        - container_runtime == 'docker'
        - ansible_os_family == "Debian"

    - name: Ajouter le dépôt Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ deb_architecture.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker
      become: true
      when:
        - container_runtime == 'docker'
        - ansible_os_family == "Debian"

    - name: Installer Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      become: true
      when:
        - container_runtime == 'docker'
        - ansible_os_family == "Debian"

    - name: Installer Docker (Alpine)
      community.general.apk:
        name: [docker, docker-cli-compose]
        state: present
        update_cache: true
      become: true
      when:
        - container_runtime == 'docker'
        - ansible_os_family == "Alpine"

    # Le paquet installé, le démon dort : sans ces deux lignes le play se
    # terminait en succès et `docker ps` répondait « Cannot connect to the
    # Docker daemon ». C'est la moitié de ce qui manquait pour que ce playbook
    # tienne sa promesse.
    - name: Démarrer et activer le service Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      become: true
      when: container_runtime == 'docker'

    # L'autre moitié. À savoir, et ce n'est pas un détail de confort :
    # appartenir au groupe `docker` donne un accès équivalent à root, puisque
    # le démon tourne en root et accepte de monter n'importe quel chemin de
    # l'hôte. C'est le compromis inhérent à Docker rootful -- et la raison pour
    # laquelle podman est le défaut de ce playbook.
    - name: Ajouter le compte au groupe docker
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: true
      become: true
      when: container_runtime == 'docker'
      register: container_docker_group

    # ------------------------------------------------------- preuve d'usage
    # Le paquet installé ne prouve rien : ce qui compte est que l'UTILISATEUR
    # puisse lancer un conteneur. On le vérifie donc SANS élévation, ce qui est
    # tout l'objet du rootless -- et ce que l'ancienne version de ce fichier ne
    # faisait jamais.
    - name: Vérifier que le runtime répond au compte, sans privilège
      ansible.builtin.command:
        cmd: "{{ container_runtime }} info"
      become: false
      register: container_smoke
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Bilan du runtime de conteneurs
      ansible.builtin.debug:
        msg: >-
          {{
            container_runtime ~ ' répond au compte ' ~ ansible_user_id ~
            ' sans privilège : le runtime est utilisable.'
            if container_smoke.rc == 0
            else
            container_runtime ~ ' est installé mais ne répond pas encore à ' ~
            ansible_user_id ~ '. ' ~ (
              'Appartenance au groupe `docker` ajoutée : elle ne prend effet
               qu à la prochaine ouverture de session. Reconnecte-toi, ou
               `newgrp docker` pour la session courante.'
              if container_runtime == 'docker' and container_docker_group is changed
              else
              'Vérifie les plages d UID subordonnés (/etc/subuid, /etc/subgid) :
               sans elles le rootless ne peut pas créer son espace de noms.
               À faire avec privilège : usermod --add-subuids 100000-165535
               --add-subgids 100000-165535 ' ~ ansible_user_id
              if container_runtime == 'podman'
              else
              'Sortie : ' ~ (container_smoke.stderr | default('') | truncate(200))
            )
          }}
