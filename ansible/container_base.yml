- name: create requirement for containerization at user_level
  hosts: all
  become: true


  vars:
    debian_packages:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
  

  tasks:

    - name: remove unecessary / conflictic software
      ansible.builtin.apt:
        pkg:
          - docker.io
          - docker-compose
          - docker-doc
          - podman-docker
          - containerd
          - runc
        state: absent

    - name: Installation des dépendances (Ubuntu/Debian)
      ansible.builtin.apt:
        name: "{{ debian_packages }}"
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    # Le module `apt_key` et le binaire `apt-key` sont supprimés des
    # distributions récentes (Debian 13, Ubuntu 24.04). La clé va donc dans un
    # keyring dédié, référencé par `signed-by` dans la définition du dépôt.
    - name: Création du répertoire des keyrings APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: ansible_os_family == "Debian"

    - name: Ajout de la clé GPG officielle Docker
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      when: ansible_os_family == "Debian"

    # L'architecture au sens Debian (amd64/arm64) ne se déduit pas de
    # `ansible_architecture`, qui renvoie x86_64. On la demande à dpkg.
    - name: Détermination de l'architecture Debian
      ansible.builtin.command: dpkg --print-architecture
      register: deb_architecture
      changed_when: false
      when: ansible_os_family == "Debian"

    - name: Ajout du dépôt Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ deb_architecture.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker
      when: ansible_os_family == "Debian"

    - name: Installation de Docker Engine (Ubuntu/Debian)
      apt:
        name: 
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    # -------- Alpine configuration -----------

    - name: Installation de Docker (Alpine)
      apk:
        name: 
          - docker
          - docker-cli-compose
        state: present
        update_cache: yes
      when: ansible_os_family == "Alpine"

