# Configuration Ansible du dépôt.
#
# Ansible ne charge ce fichier que si la commande est lancée DEPUIS la racine
# du dépôt -- c'est le cas de toutes les tâches du Taskfile. Il raccourcit donc
# les commandes locales sans jamais s'imposer aux autres exécutions.
#
# Vagrant n'est pas concerné : son provisioner ansible s'exécute depuis Test/
# (ce fichier n'y est pas cherché) et passe SON inventaire généré en ligne de
# commande, qui prime de toute façon sur la valeur ci-dessous. L'appartenance
# des VMs au groupe `dotfiles` est donc assurée là-bas par `ansible.groups`,
# pas ici.
[defaults]
# Inventaire par défaut : `ansible-playbook ansible/dotfiles.yml` suffit.
# ATTENTION : ce réglage vaut pour TOUS les playbooks du dépôt, pas seulement
# pour dotfiles.yml. Un play en `hosts: all` hériterait donc de localhost sans
# qu'on ait rien demandé -- c'est pour cela que container_base.yml, qui est
# privilégié et réécrit la pile Docker, cible désormais un groupe [containers]
# laissé vide. Tout nouveau playbook doit se donner un groupe explicite.
inventory = ansible/inventory.ini

# Sans ce réglage, Ansible commente à chaque exécution sa découverte de
# l'interpréteur Python de la cible. `auto_silent` conserve exactement le même
# choix d'interpréteur, il cesse simplement de l'annoncer.
interpreter_python = auto_silent
